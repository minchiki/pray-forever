name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Format, lint, unit tests, debug build
        run: ./gradlew spotlessCheck lintDebug testDebugUnitTest assembleDebug

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  ios:
    uses: ./.github/workflows/ios.yml
