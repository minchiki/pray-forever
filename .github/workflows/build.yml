name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Cache Quran speech model
        uses: actions/cache@v4
        with:
          path: Sajda/Resources/QuranModel
          key: quran-model-${{ hashFiles('scripts/fetch_quran_model.sh') }}

      - name: Download Quran speech model (Tarteel whisper-base-ar-quran, Core ML)
        run: bash scripts/fetch_quran_model.sh

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project Sajda.xcodeproj -scheme Sajda

      - name: Unit tests
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), key=lambda k: [int(p) if p.isdigit() else 0 for p in k.split("-")])
          for rt in reversed(runtimes):
              phones = [d for d in devices[rt] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulator: $SIM"
          xcodebuild test -project Sajda.xcodeproj -scheme Sajda -destination "id=$SIM" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build unsigned IPA
        run: |
          xcodebuild build -project Sajda.xcodeproj -scheme Sajda -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" -quiet
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sajda.app Payload/
          zip -qry Sajda.ipa Payload
          ls -lh Sajda.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Sajda-ipa
          path: Sajda.ipa
          retention-days: 30
