name: Ошибка
description: Что-то работает не так, как ожидалось
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Платформа
      options: [Android, iOS]
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Устройство и версия системы
      placeholder: Pixel 7, Android 15 / iPhone 13, iOS 18.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия приложения
      description: Настройки → О приложении (Android) или из названия файла релиза
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги
      description: Что вы делали перед ошибкой
      placeholder: |
        1. Включил будильник Фаджра, задержка 5 мин
        2. Закрыл приложение и заблокировал экран
        3. В 05:06 будильник не зазвонил
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидали и что произошло
    validations:
      required: true
  - type: textarea
    id: settings
    attributes:
      label: Настройки будильника
      description: Если проблема с временем или звонком — метод расчёта, мазхаб, город, задержка, задание
  - type: textarea
    id: logs
    attributes:
      label: Скриншоты или логи
      description: Для Android можно приложить `adb logcat`. Уберите личные данные.
