name: Sajda
options:
  bundleIdPrefix: com.prayforever
  developmentLanguage: ru
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Adhan:
    url: https://github.com/batoulapps/adhan-swift
    from: "1.3.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES

targets:
  Sajda:
    type: application
    platform: iOS
    sources:
      - path: Sajda
    dependencies:
      - package: Adhan
      - target: SajdaWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prayforever.app
        PRODUCT_NAME: Sajda
        INFOPLIST_FILE: Sajda/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sajda/Sajda.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO

  SajdaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SajdaWidget
      - path: Sajda/Models/Prayer.swift
      - path: Sajda/Models/AppSettings.swift
      - path: Sajda/Models/SharedStorage.swift
      - path: Sajda/Services/PrayerTimeCalculator.swift
      - path: Sajda/Resources/ru.lproj/Localizable.strings
      - path: Sajda/Resources/en.lproj/Localizable.strings
    dependencies:
      - package: Adhan
    info:
      path: SajdaWidget/Info.plist
      properties:
        CFBundleDisplayName: pray.forever
        CFBundleDevelopmentRegion: ru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: SajdaWidget/SajdaWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.prayforever.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prayforever.app.widget
        PRODUCT_NAME: SajdaWidget
        SKIP_INSTALL: YES

  SajdaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SajdaTests
    dependencies:
      - target: Sajda
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.prayforever.app.tests

schemes:
  Sajda:
    build:
      targets:
        Sajda: all
        SajdaTests: [test]
    test:
      targets:
        - SajdaTests
